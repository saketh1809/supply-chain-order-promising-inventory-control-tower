server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness for the container health check.
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # REST API (versioned under /api/v1) and Swagger docs go to the backend service.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|woff2?|png|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
